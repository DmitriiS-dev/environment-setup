# Terminal and color support.
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard on
set -g allow-passthrough on

# Mouse, history, and responsive mode switching.
set -g mouse on
set -g history-limit 50000
set -s escape-time 0

# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1

# Split panes in the current directory with | and -.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this configuration with the tmux prefix followed by r.
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# Status bar colors and content.
set -g status-style "bg=#1e1e1e,fg=#cccccc"
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=#4ec9b0,bold] #S #[default] "
set -g status-right "#[fg=#9cdcfe]%Y-%m-%d #[fg=#ce9178]%H:%M #[default]"
